    <script>
        // ================================================================
        // CONFIGURATION – UPDATE YOUR APPS SCRIPT URL HERE
        // ================================================================
        const CONFIG = {
            siteName: "DropYourWebsite.com",
            apiUrl: "https://script.google.com/macros/s/AKfycby_vEo8NZIOYJeVUutfEuZTtS1Zu-rql5cLthGQksVhXUrBeU4PaToxNDaDT1A7q-1T/exec", // <-- REPLACE THIS
            maxDescriptionLength: 300,
            perPage: 20,
            linkRel: "noopener noreferrer",
            // Cache expiration in minutes
            cacheExpirationMinutes: 2
        };

        // ================================================================
        // STATE
        // ================================================================
        let allWebsites = [];
        let filteredWebsites = [];
        let displayedCount = 0;
        let isLoading = false;
        let hasMore = true;
        let isSubmitting = false;
        let isCacheValid = false;

        // ================================================================
        // DOM REFS
        // ================================================================
        const form = document.getElementById('submitForm');
        const siteName = document.getElementById('siteName');
        const siteDesc = document.getElementById('siteDesc');
        const siteUrl = document.getElementById('siteUrl');
        const submitBtn = document.getElementById('submitBtn');
        const formMessage = document.getElementById('formMessage');
        const charCount = document.getElementById('charCount');
        const websiteList = document.getElementById('websiteList');
        const totalCount = document.getElementById('totalCount');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const loadMoreWrap = document.getElementById('loadMoreWrap');
        const searchInput = document.getElementById('searchInput');

        // ================================================================
        // CACHE HELPERS
        // ================================================================
        function saveCache(data, total) {
            try {
                const cache = {
                    timestamp: Date.now(),
                    data: data,
                    total: total
                };
                localStorage.setItem('dropwebsite_cache', JSON.stringify(cache));
            } catch (e) {
                // ignore storage errors
            }
        }

        function loadCache() {
            try {
                const raw = localStorage.getItem('dropwebsite_cache');
                if (!raw) return null;
                const cache = JSON.parse(raw);
                const now = Date.now();
                const expire = CONFIG.cacheExpirationMinutes * 60 * 1000;
                if (now - cache.timestamp > expire) {
                    localStorage.removeItem('dropwebsite_cache');
                    return null;
                }
                return cache;
            } catch (e) {
                return null;
            }
        }

        function clearCache() {
            localStorage.removeItem('dropwebsite_cache');
        }

        // ================================================================
        // HELPERS
        // ================================================================
        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) { return false; }
        }

        function getDomain(url) {
            try {
                const u = new URL(url);
                return u.hostname;
            } catch (_) { return url; }
        }

        function showMessage(msg, type) {
            formMessage.textContent = msg;
            formMessage.className = 'form-message ' + type;
        }

        function hideMessage() {
            formMessage.className = 'form-message';
            formMessage.textContent = '';
        }

        function setLoading(loading) {
            if (loading) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span> Dropping...';
            } else {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Drop Your Website';
            }
        }

        // ================================================================
        // API CALLS
        // ================================================================
        async function fetchWebsites(limit, offset) {
            const url = CONFIG.apiUrl +
                '?action=fetch&limit=' + encodeURIComponent(limit) +
                '&offset=' + encodeURIComponent(offset);
            const response = await fetch(url);
            if (!response.ok) throw new Error('Network error');
            return await response.json();
        }

        // ================================================================
        // UPDATED submitWebsite – uses text/plain to avoid CORS preflight
        // ================================================================
        async function submitWebsite(name, description, url) {
            const payload = { action: 'submit', name, description, url };
            const response = await fetch(CONFIG.apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error('Network error');
            return await response.json();
        }

        async function trackClick(id) {
            try {
                await fetch(CONFIG.apiUrl + '?action=click&id=' + encodeURIComponent(id));
            } catch (_) {}
        }

        // ================================================================
        // LOAD WEBSITES (with cache)
        // ================================================================
        async function loadWebsites(reset = false) {
            if (isLoading) return;
            isLoading = true;

            if (reset) {
                allWebsites = [];
                filteredWebsites = [];
                displayedCount = 0;
                hasMore = true;
                websiteList.innerHTML = '';
                loadMoreBtn.disabled = false;
                loadMoreBtn.textContent = 'Load More ↓';
                clearCache();
            }

            // Try cache first (unless reset is true)
            if (!reset) {
                const cached = loadCache();
                if (cached) {
                    allWebsites = cached.data;
                    filteredWebsites = allWebsites.slice();
                    totalCount.textContent = cached.total;
                    displayedCount = 0;
                    renderWebsites();
                    // Determine if more pages exist
                    if (allWebsites.length >= cached.total) {
                        hasMore = false;
                        loadMoreBtn.disabled = true;
                        loadMoreBtn.textContent = 'All loaded';
                    } else {
                        hasMore = true;
                        loadMoreBtn.disabled = false;
                        loadMoreBtn.textContent = 'Load More ↓';
                    }
                    isLoading = false;
                    return;
                }
            }

            // No cache – fetch from server
            if (allWebsites.length === 0) {
                websiteList.innerHTML = `
                        <div class="loading-state">
                            Loading dropped websites
                            <span class="dot-pulse"></span>
                            <span class="dot-pulse"></span>
                            <span class="dot-pulse"></span>
                        </div>
                    `;
            }

            try {
                const offset = allWebsites.length;
                const data = await fetchWebsites(CONFIG.perPage, offset);

                if (data.status === 'success') {
                    const newSites = data.websites || [];
                    if (newSites.length === 0) {
                        hasMore = false;
                        loadMoreBtn.disabled = true;
                        loadMoreBtn.textContent = 'No more websites';
                    } else {
                        allWebsites = allWebsites.concat(newSites);
                        if (newSites.length < CONFIG.perPage) {
                            hasMore = false;
                            loadMoreBtn.disabled = true;
                            loadMoreBtn.textContent = 'All loaded';
                        } else {
                            hasMore = true;
                            loadMoreBtn.disabled = false;
                            loadMoreBtn.textContent = 'Load More ↓';
                        }
                    }
                    totalCount.textContent = data.total || allWebsites.length;
                    // Save cache
                    saveCache(allWebsites, data.total || allWebsites.length);
                    applySearch();
                    renderWebsites();
                } else {
                    throw new Error(data.message || 'Failed to load');
                }
            } catch (err) {
                console.error('Load error:', err);
                if (allWebsites.length === 0) {
                    websiteList.innerHTML = `
                            <div class="empty-state">
                                <span class="empty-emoji">⚠️</span>
                                Something went wrong. Please try again later.
                            </div>
                        `;
                }
                loadMoreBtn.disabled = false;
                loadMoreBtn.textContent = 'Retry ↓';
            }
            isLoading = false;
        }

        // ================================================================
        // SEARCH
        // ================================================================
        function applySearch() {
            const term = searchInput.value.trim().toLowerCase();
            if (!term) {
                filteredWebsites = allWebsites.slice();
            } else {
                filteredWebsites = allWebsites.filter(function(site) {
                    const name = (site.name || '').toLowerCase();
                    const desc = (site.description || '').toLowerCase();
                    const url = (site.url || '').toLowerCase();
                    return name.includes(term) || desc.includes(term) || url.includes(term);
                });
            }
            displayedCount = 0;
            renderWebsites();
            if (term) {
                loadMoreWrap.classList.add('hidden');
            } else {
                loadMoreWrap.classList.remove('hidden');
                if (!hasMore) {
                    loadMoreBtn.textContent = 'All loaded';
                    loadMoreBtn.disabled = true;
                } else {
                    loadMoreBtn.textContent = 'Load More ↓';
                    loadMoreBtn.disabled = false;
                }
            }
        }

        searchInput.addEventListener('input', applySearch);

        // ================================================================
        // RENDER
        // ================================================================
        function buildCard(site) {
            const name = escapeHtml(site.name || 'Untitled');
            const desc = escapeHtml(site.description || '');
            const url = site.url || '#';
            const domain = getDomain(url);
            const featured = site.featured === true || site.featured === 'true';
            const clicks = site.clicks || 0;
            const featuredBadge = featured ? '<div class="featured-badge">⭐ Featured</div>' : '';

            return `
                    <div class="website-card ${featured ? 'featured' : ''}">
                        ${featuredBadge}
                        <div class="site-name">${name}</div>
                        ${desc ? '<div class="site-desc">' + desc + '</div>' : ''}
                        <div class="site-meta">
                            <span class="site-domain">${escapeHtml(domain)}</span>
                            <div style="display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;">
                                ${clicks > 0 ? '<span class="site-stats">' + clicks + ' visits</span>' : ''}
                                <a href="${escapeHtml(url)}" class="btn-visit" target="_blank" rel="${CONFIG.linkRel}" data-id="${escapeHtml(site.id || '')}">
                                    Visit Website <span class="arrow">→</span>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
        }

        function renderWebsites() {
            const slice = filteredWebsites.slice(0, displayedCount + CONFIG.perPage);

            if (filteredWebsites.length === 0) {
                websiteList.innerHTML = `
                        <div class="empty-state">
                            <span class="empty-emoji">🌐</span>
                            No websites found.
                            <span class="empty-cta">Be the first one. 👇</span>
                        </div>
                    `;
                loadMoreWrap.classList.add('hidden');
                return;
            }

            if (displayedCount === 0) {
                websiteList.innerHTML = '';
            }

            const newSites = slice.slice(displayedCount);
            let html = '';
            for (let i = 0; i < newSites.length; i++) {
                html += buildCard(newSites[i]);
            }

            if (displayedCount === 0) {
                websiteList.innerHTML = html;
            } else {
                websiteList.insertAdjacentHTML('beforeend', html);
            }

            displayedCount = slice.length;

            const searchTerm = searchInput.value.trim();
            if (searchTerm) {
                loadMoreWrap.classList.add('hidden');
            } else {
                loadMoreWrap.classList.remove('hidden');
                if (!hasMore || displayedCount >= allWebsites.length) {
                    loadMoreBtn.textContent = 'All loaded';
                    loadMoreBtn.disabled = true;
                } else {
                    loadMoreBtn.textContent = 'Load More ↓';
                    loadMoreBtn.disabled = false;
                }
            }
        }

        // ================================================================
        // CLICK TRACKING
        // ================================================================
        document.addEventListener('click', function(e) {
            const link = e.target.closest('.btn-visit');
            if (!link) return;
            const id = link.getAttribute('data-id');
            if (id) trackClick(id);
        });

        // ================================================================
        // LOAD MORE
        // ================================================================
        loadMoreBtn.addEventListener('click', function() {
            if (isLoading || !hasMore) return;
            if (filteredWebsites.length < allWebsites.length) {
                renderWebsites();
            } else {
                loadWebsites(false);
            }
        });

        // ================================================================
        // CHAR COUNT
        // ================================================================
        siteDesc.addEventListener('input', function() {
            const len = this.value.length;
            charCount.textContent = len + ' / ' + CONFIG.maxDescriptionLength;
            charCount.classList.toggle('warn', len > CONFIG.maxDescriptionLength * 0.85);
        });

        // ================================================================
        // SUBMIT
        // ================================================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            if (isSubmitting) return;

            const name = siteName.value.trim();
            const description = siteDesc.value.trim();
            const url = siteUrl.value.trim();

            if (!name) { showMessage('Please enter a website name.', 'error'); siteName.focus(); return; }
            if (!description) { showMessage('Please enter a description.', 'error'); siteDesc.focus(); return; }
            if (description.length > CONFIG.maxDescriptionLength) {
                showMessage('Description too long. Max ' + CONFIG.maxDescriptionLength + ' chars.', 'error');
                siteDesc.focus();
                return;
            }
            if (!url) { showMessage('Please enter a URL.', 'error'); siteUrl.focus(); return; }
            if (!isValidUrl(url)) {
                showMessage('Please enter a valid URL (http:// or https://).', 'error');
                siteUrl.focus();
                return;
            }

            // Check duplicate (from local data)
            if (allWebsites.some(function(s) { return s.url && s.url.toLowerCase() === url.toLowerCase(); })) {
                showMessage('This website has already been dropped.', 'error');
                return;
            }

            isSubmitting = true;
            setLoading(true);
            hideMessage();

            try {
                const result = await submitWebsite(name, description, url);
                if (result.status === 'success') {
                    showMessage('Your website has been dropped! 🎉', 'success');
                    form.reset();
                    charCount.textContent = '0 / ' + CONFIG.maxDescriptionLength;
                    // Clear cache and reload to show new entry
                    clearCache();
                    setTimeout(function() {
                        allWebsites = [];
                        filteredWebsites = [];
                        displayedCount = 0;
                        hasMore = true;
                        loadWebsites(true);
                    }, 500);
                } else {
                    throw new Error(result.message || 'Submission failed');
                }
            } catch (err) {
                console.error('Submit error:', err);
                showMessage(err.message || 'Something went wrong. Try again later.', 'error');
            }

            isSubmitting = false;
            setLoading(false);
        });

        // ================================================================
        // INIT
        // ================================================================
        loadWebsites(true);
        console.log('🚀 DropYourWebsite.com loaded.');
        console.log('🔗 API URL:', CONFIG.apiUrl);
    </script>
</body>
</html>
